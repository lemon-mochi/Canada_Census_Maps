<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StatCan Provincial Population Map</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@4/dist/pmtiles.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { height: 100vh; width: 100vw; }
    .legend {
      position: absolute; bottom: 30px; right: 20px;
      background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 6px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .legend-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 13px; }
    .color-box { width: 20px; height: 18px; margin-right: 8px; border-radius: 2px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="legend">
    <h4 style="margin: 0 0 10px 0;">2021 Population</h4>
    <div class="legend-item"><span class="color-box" style="background: #f7fbff;"></span> &lt; 100,000</div>
    <div class="legend-item"><span class="color-box" style="background: #c6dbef;"></span> 100,000 – 1,000,000</div>
    <div class="legend-item"><span class="color-box" style="background: #6baed6;"></span> 1,000,000 – 4,000,000</div>
    <div class="legend-item"><span class="color-box" style="background: #2171b5;"></span> 4,000,000 – 8,000,000</div>
    <div class="legend-item"><span class="color-box" style="background: #08306b;"></span> 8,000,000+</div>
  </div>

  <script>

    // Path to PMTiles file hosted by FastAPI
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const PMTILES_URL =
        "http://localhost:8000/tiles_output/lpr_000b21a_e.pmtiles";

    const testPMTiles = new pmtiles.PMTiles(PMTILES_URL); 

    const SOURCE_LAYER = "lpr_000b21a_e";

    const p = new pmtiles.PMTiles(PMTILES_URL);
    protocol.add(p);

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'osm-basemap': {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256
          },
          'provincial-vector-source': {
            type: 'vector',
            url: `pmtiles://${PMTILES_URL}`,
            promoteId: 'PRUID'
          }
        },
        layers: [
          {
            id: 'basemap',
            type: 'raster',
            source: 'osm-basemap'
          },
          {
            id: 'province-fill',
            type: 'fill',
            source: 'provincial-vector-source',
            'source-layer': SOURCE_LAYER,
            paint: {
              'fill-color': [
                'interpolate',
                ['linear'],
                ['feature-state', 'pop_2021'],
                0,        '#f7fbff',
                100000,   '#c6dbef',
                1000000,  '#6baed6',
                4000000,  '#2171b5',
                8000000,  '#08306b'
              ],
              'fill-opacity': 0.75
            }
          },
          {
            id: 'province-borders',
            type: 'line',
            source: 'provincial-vector-source',
            'source-layer': SOURCE_LAYER,
            paint: {
              'line-color': '#ffffff',
              'line-width': 1.2
            }
          }
        ]
      },
      center: [-98.5795, 56.1304],
      zoom: 3.5
    });

    let populationData = {};

    // 2. Fetch population lookup dict from FastAPI
    async function loadPopulationData() {
      try {
        const res = await fetch('http://localhost:8000/api/province-population');
        const json = await res.json();
        populationData = json.data;
        updateMapFeatureStates();
      } catch (err) {
        console.error("Failed to load census population:", err);
      }
    }

    // 3. Map population values onto vector features using PRUID
    function updateMapFeatureStates() {
      if (!Object.keys(populationData).length) return;

      const features = map.querySourceFeatures(
        'provincial-vector-source',
        {
          sourceLayer: SOURCE_LAYER
        }
      );

      features.forEach(feature => {
        const pruid = String(feature.properties.PRUID);
        const pop = populationData[pruid];

        if (pop !== undefined && feature.id !== undefined) {
          map.setFeatureState(
            {
              source: 'provincial-vector-source',
              sourceLayer: SOURCE_LAYER,
              id: feature.id
            },
            { pop_2021: pop }
          );
        }
      });
    }

    map.on('load', loadPopulationData);
    map.on('sourcedata', (e) => {
      if (e.isSourceLoaded && e.sourceId === 'provincial-vector-source') {
        updateMapFeatureStates();
      }
    });

    // 4. On-click Popup
    map.on('click', 'province-fill', (e) => {
      const feature = e.features[0];

      console.log("PROPERTIES:", feature.properties);
      console.log("FEATURE ID:", feature.id);      
      console.log("FEATURE:", e.features[0]);
      console.log("PROPERTIES:", e.features[0].properties);
      console.log("ID:", e.features[0].id);
      console.log(e.features[0].properties);
      const props = e.features[0].properties;
      const pruid = props.PRUID;
      const provName = props.PRENAME || props.PRNAME || "Province";
      const pop = populationData[pruid] ? populationData[pruid].toLocaleString() : "N/A";

      new maplibregl.Popup()
        .setLngLat(e.lngLat)
        .setHTML(`<strong>${provName}</strong><br/>2021 Population: ${pop}`)
        .addTo(map);
    });

    map.on('mouseenter', 'province-fill', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'province-fill', () => map.getCanvas().style.cursor = '');
  </script>
</body>
</html>
